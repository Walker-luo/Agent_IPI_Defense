<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 616" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">BaseIntent execution path</title>
  <desc id="figure-desc">L2 authorizes a trusted task. The planner's batch passes precheck, applicable L3 audit, and the monitor before native execution. Raw history supplies planning, audit evidence, and intent progress, which guides the planner or leads to a reply.</desc>
  <defs>
    <marker id="navy" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#122544"/>
    </marker>
    <marker id="blue" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#215bc8"/>
    </marker>
    <marker id="green" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#08775d"/>
    </marker>
    <g id="request" class="icon">
      <circle cx="17" cy="12" r="8" fill="#fff1cf"/>
      <path d="M3 37v-2a14 14 0 0 1 28 0v2Z" fill="#c9e7ff"/>
      <rect x="32" y="12" width="24" height="28" rx="3" fill="#fff"/>
      <path d="M38 20h12m-12 6h12m-12 6h8"/>
    </g>
    <g id="key" class="icon">
      <path d="M41 6a13 13 0 0 0-12 17L8 42v8h8v-5h6v-6h5l10-10A13 13 0 1 0 41 6Z" fill="#ffd36e"/>
      <circle cx="43" cy="16" r="4" fill="#fff"/>
    </g>
    <g id="planner" class="icon">
      <path d="M29 8v6m-18 32a20 20 0 0 1 36 0"/>
      <circle cx="29" cy="5" r="3" fill="#fff"/>
      <rect x="5" y="22" width="47" height="12" rx="5" fill="#aedaff"/>
      <rect x="10" y="14" width="37" height="27" rx="10" fill="#fff"/>
      <rect x="16" y="22" width="25" height="12" rx="5" fill="#122544"/>
      <circle cx="22" cy="28" r="2" fill="#c9e7ff" stroke="none"/>
      <circle cx="35" cy="28" r="2" fill="#c9e7ff" stroke="none"/>
    </g>
    <g id="checklist" class="icon">
      <rect x="10" y="10" width="37" height="38" rx="5" fill="#fff"/>
      <path d="M19 11V7h5a5 5 0 0 1 10 0h5v9H19Z" fill="#c9e7ff"/>
      <path d="m17 26 3 3 6-7m-9 16 3 3 6-7" stroke="#08775d"/>
      <path d="M31 27h9m-9 12h9"/>
    </g>
    <g id="audit" class="icon">
      <path d="M7 5h25l9 9v30H7Z" fill="#fff"/>
      <path d="M32 5v10h9M13 17h13m-13 7h12m-12 7h9m-9 7h12"/>
      <path d="m43 39 10 10" stroke-width="5"/>
      <circle cx="37" cy="32" r="11" fill="#ffd36e"/>
      <circle cx="37" cy="32" r="6" fill="#fff"/>
    </g>
    <g id="lock" class="icon">
      <path d="M17 23V16a12 12 0 0 1 24 0v7"/>
      <rect x="12" y="22" width="34" height="25" rx="5" fill="#ffd36e"/>
      <circle cx="29" cy="32" r="2" fill="#122544"/>
      <path d="M29 35v5"/>
    </g>
    <g id="tools" class="icon">
      <path d="m11 6 5 1 8 8-1 4 22 22-5 5-22-22-4 1-8-8-1-5 6 5 5-5Z" fill="#d9edff"/>
      <path d="M40 6a10 10 0 0 0-9 14L10 41a5 5 0 0 0 7 7l21-21A10 10 0 0 0 51 14l-7 6-5-5 6-7Z" fill="#ffd36e"/>
    </g>
    <g id="pages" class="icon">
      <rect x="20" y="5" width="33" height="25" rx="4" fill="#d9edff"/>
      <rect x="14" y="10" width="33" height="25" rx="4" fill="#edf6ff"/>
      <rect x="8" y="15" width="33" height="25" rx="4" fill="#fff"/>
      <path d="M14 23h20m-20 6h16m-16 6h11"/>
    </g>
    <g id="progress" class="icon">
      <rect x="9" y="26" width="9" height="16" rx="2" fill="#bce1ff"/>
      <rect x="24" y="17" width="9" height="25" rx="2" fill="#bce1ff"/>
      <rect x="39" y="7" width="9" height="35" rx="2" fill="#bce1ff"/>
    </g>
    <g id="reply" class="icon">
      <path d="M8 20a14 14 0 0 1 14-14h15a14 14 0 0 1 0 28H25l-11 9v-12a14 14 0 0 1-6-11Z" fill="#fff"/>
      <circle cx="21" cy="20" r="1.5" fill="#122544"/>
      <circle cx="29" cy="20" r="1.5" fill="#122544"/>
      <circle cx="37" cy="20" r="1.5" fill="#122544"/>
    </g>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #122544; text-anchor: middle; }
    .title { font-size: 26px; }
    .detail, .label { font-size: 22px; }
    .auth-detail { font-size: 21px; }
    .card { fill: #fff; stroke: #122544; stroke-width: 2.3; }
    .active { fill: #fff1d3; }
    .stripe { fill: #fff; stroke: #6d7b90; stroke-width: 1.2; }
    .icon { stroke: #122544; stroke-width: 2.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .flow, .bypass, .return { fill: none; stroke-width: 3.3; stroke-linejoin: round; }
    .flow { stroke: #122544; marker-end: url(#navy); }
    .bypass { stroke: #215bc8; marker-end: url(#blue); }
    .return { stroke: #08775d; marker-end: url(#green); }
    .feedback { stroke-dasharray: 9 6; }
    .blue-label { fill: #184cae; }
    .green-label { fill: #065f4b; }
  </style>
  <rect width="1600" height="616" fill="#fff"/>
  <g id="regions" stroke-width="1.2">
    <rect x="12" y="12" width="493" height="592" rx="24" fill="#faf4e9" stroke="#bead93"/>
    <rect x="513" y="12" width="716" height="592" rx="24" fill="#e9f3ff" stroke="#8aafd4"/>
    <rect x="1237" y="12" width="351" height="592" rx="24" fill="#ebf8f1" stroke="#92b9aa"/>
  </g>
  <g id="arrows">
    <path id="task-to-authorization" class="flow" d="M144 100H168"/>
    <path id="authorization-to-planner" class="flow" d="M320 184V216"/>
    <path id="planner-to-precheck" class="flow" d="M414 296H527"/>
    <path id="precheck-to-audit" class="flow" d="M704 296H739"/>
    <path id="audit-to-monitor" class="flow" d="M916 296H963"/>
    <path id="monitor-to-tools" class="flow" d="M1140 296H1311"/>
    <path id="precheck-to-monitor" class="bypass" d="M615.5 216V120Q615.5 112 623.5 112H1043.5Q1051.5 112 1051.5 120V216"/>
    <path id="tools-to-history" class="return" d="M1433 368V414Q1433 422 1425 422H865Q857 422 857 430V456"/>
    <path id="history-to-audit" class="return" d="M794 456V368"/>
    <path id="history-to-l1" class="return" d="M701 507H414"/>
    <path id="l1-to-planner" class="return" d="M320 456V368"/>
    <path id="history-to-progress" class="return" d="M889 507H1003"/>
    <path id="progress-to-reply" class="flow" d="M1183 507H1323"/>
    <path id="progress-to-planner" class="return feedback" d="M1093 556V578Q1093 586 1085 586H192Q184 586 184 578V310Q184 302 192 302H226"/>
    <text class="label blue-label" x="827" y="93">Eligible reads skip L3</text>
    <text class="label" x="1231" y="277">Tickets</text>
    <text class="label green-label" x="1226" y="407">Tool results</text>
    <text class="label green-label" x="851" y="402">Evidence</text>
    <text class="label green-label" x="946" y="475">Raw<tspan x="946" dy="23">messages</tspan></text>
    <text class="label green-label" x="581" y="573">Current or next intent</text>
  </g>
  <g id="trusted-task">
    <rect class="card" x="29" y="48" width="115" height="104" rx="13"/>
    <use xlink:href="#request" transform="translate(57 53) scale(.95)"/>
    <text class="title" x="86.5" y="116">Trusted<tspan x="86.5" dy="26">task</tspan></text>
  </g>
  <g id="l2-authorization">
    <rect class="card active" x="168" y="22" width="324" height="168" rx="15"/>
    <use xlink:href="#key" transform="translate(184 24) scale(.65)"/>
    <text class="title" x="346" y="53">L2 Authorization</text>
    <rect class="stripe" x="180" y="64" width="300" height="28" rx="7"/>
    <rect class="stripe" x="180" y="100" width="300" height="28" rx="7"/>
    <rect class="stripe" x="180" y="136" width="300" height="28" rx="7"/>
    <text class="auth-detail" x="330" y="85">1. Intents and goal types</text>
    <text class="auth-detail" x="330" y="121">Host: Fold prep, assign IDs</text>
    <text class="auth-detail" x="330" y="157">2. Grants and progress links</text>
  </g>
  <g id="main-planner">
    <rect class="card" x="226" y="216" width="188" height="152" rx="15"/>
    <use xlink:href="#planner" transform="translate(284 235) scale(1.25)"/>
    <text class="title" x="320" y="331">Planner</text>
  </g>
  <g id="l2-precheck">
    <rect class="card active" x="527" y="216" width="177" height="152" rx="15"/>
    <use xlink:href="#checklist" transform="translate(590 223) scale(.9)"/>
    <text class="title" x="615.5" y="289">L2 Batch<tspan x="615.5" dy="27">Precheck</tspan></text>
    <text class="detail" x="615.5" y="339">Grants and<tspan x="615.5" dy="21">native schema</tspan></text>
  </g>
  <g id="l3-audit">
    <rect class="card active" x="739" y="216" width="177" height="152" rx="15"/>
    <use xlink:href="#audit" transform="translate(799 224)"/>
    <text class="title" x="827.5" y="293">L3 Action<tspan x="827.5" dy="27">Audit</tspan></text>
    <text class="detail" x="827.5" y="349">Task alignment</text>
  </g>
  <g id="reference-monitor">
    <rect class="card" x="963" y="216" width="177" height="152" rx="15"/>
    <use xlink:href="#lock" transform="translate(1026 224) scale(.9)"/>
    <text class="title" x="1051.5" y="289">Reference<tspan x="1051.5" dy="27">Monitor</tspan></text>
    <text class="detail" x="1051.5" y="339">Whole-batch<tspan x="1051.5" dy="21">receipt</tspan></text>
  </g>
  <g id="native-tools">
    <rect class="card" x="1311" y="216" width="244" height="152" rx="15"/>
    <use xlink:href="#tools" transform="translate(1404 227)"/>
    <text class="title" x="1433" y="308">Native Tools</text>
    <text class="detail" x="1433" y="344">Original batch order</text>
  </g>
  <g id="planning-view">
    <rect class="card" x="226" y="456" width="188" height="100" rx="14"/>
    <use xlink:href="#pages" transform="translate(295 461) scale(.83)"/>
    <text class="title" x="320" y="518">L1 Planning<tspan x="320" dy="26">View</tspan></text>
  </g>
  <g id="raw-history">
    <rect class="card" x="701" y="456" width="188" height="100" rx="14"/>
    <use xlink:href="#pages" transform="translate(771 463) scale(.82)"/>
    <text class="title" x="795" y="537">Raw History</text>
  </g>
  <g id="intent-progress">
    <rect class="card" x="1003" y="456" width="180" height="100" rx="14"/>
    <use xlink:href="#progress" transform="translate(1070 460) scale(.8)"/>
    <text class="title" x="1093" y="518">Intent<tspan x="1093" dy="26">Progress</tspan></text>
  </g>
  <g id="final-reply">
    <rect class="card" x="1323" y="456" width="220" height="100" rx="14"/>
    <use xlink:href="#reply" transform="translate(1409 461) scale(.83)"/>
    <text class="title" x="1433" y="518">Final Reply or<tspan x="1433" dy="26">Clarification</tspan></text>
  </g>
</svg>
